<script src="../bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>
<script>
  const syncMediaHeights = () => {
    const carousel = document.getElementById('carouselExampleAutoplaying');
    const videoFrame = document.querySelector('.video-frame');

    if (!carousel || !videoFrame) {
      return;
    }

    if (window.innerWidth >= 992) {
      videoFrame.style.height = carousel.offsetHeight + 'px';
    } else {
      videoFrame.style.height = '';
    }
  };

  window.addEventListener('load', syncMediaHeights);
  window.addEventListener('resize', syncMediaHeights);
</script>
